<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oraku — Notifications</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f11;
      color: #e4e4e7;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid #1e1e24;
      position: sticky;
      top: 0;
      background: #0f0f11;
      z-index: 10;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .logo span { color: #7c6dfa; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    #timestamp { font-size: 13px; color: #52525b; }
    #next-run  { font-size: 12px; color: #3f3f46; }
    #next-run span { color: #7c6dfa; }

    #seed-btn {
      background: #7c6dfa;
      color: #fff;
      border: none;
      padding: 9px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #seed-btn:hover { background: #6b5cf0; }
    #seed-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid #fff3;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    main {
      padding: 32px;
      max-width: 1200px;
      margin: 0 auto;
    }

    #empty {
      text-align: center;
      padding: 80px 0;
      color: #3f3f46;
    }

    #empty p { font-size: 15px; margin-top: 8px; }
    #empty .icon { font-size: 48px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .user-card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 14px;
      overflow: hidden;
    }

    .user-card-header {
      padding: 16px 20px;
      border-bottom: 1px solid #27272a;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }

    .user-info { min-width: 0; flex: 1; }

    .user-name {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .notifications-list { padding: 12px 0; }

    .notif-item {
      padding: 12px 20px;
      border-bottom: 1px solid #1e1e24;
      font-size: 13.5px;
      line-height: 1.55;
      color: #d4d4d8;
      transition: background 0.1s;
    }

    .notif-item:last-child { border-bottom: none; }
    .notif-item:hover { background: #1f1f23; }

    .notif-time {
      display: block;
      font-size: 11px;
      color: #52525b;
      margin-top: 4px;
    }

    .no-notifs {
      padding: 24px 20px;
      font-size: 13px;
      color: #3f3f46;
      text-align: center;
    }

    #error-banner {
      display: none;
      background: #3f1a1a;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      padding: 12px 20px;
      border-radius: 10px;
      margin-bottom: 24px;
      font-size: 13px;
    }

    .color-0 { background: #1e1a40; color: #a78bfa; }
    .color-1 { background: #0f2d26; color: #34d399; }
    .color-2 { background: #2d1a0f; color: #fb923c; }
  </style>
</head>
<body>

<header>
  <div class="logo">ora<span>ku</span></div>
  <div class="header-right">
    <div class="header-meta">
      <span id="timestamp"></span>
      <span id="next-run"></span>
    </div>
    <button id="seed-btn" onclick="reseed()">
      <span class="spinner" id="spinner"></span>
      Reseed
    </button>
  </div>
</header>

<main>
  <div id="error-banner"></div>

  <div id="empty">
    <div class="icon">⏳</div>
    <p>Waiting for notifications&hellip;</p>
    <p style="font-size:12px;margin-top:6px;">Oraku will generate notifications 30 min before a detected routine</p>
  </div>

  <div class="grid" id="grid" style="display:none;"></div>
</main>

<script>
  const shownIds = new Set()
  const typeColors = { reminder: '#7c6dfa', warning: '#f97316', achievement: '#22c55e', insight: '#38bdf8', nudge: '#a78bfa' }
  const typeLabels = { 'streak-ongoing': 'streak', 'streak-break': 'break', 'checklist': 'checklist', 'milestone': 'milestone', 'threshold': 'threshold', 'item-analysis': 'analysis' }

  // request browser notification permission on load
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission()
  }

  function fireDesktopNotif(title, body) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return
    new Notification(title, { body, icon: '/favicon.ico', silent: false })
  }

  async function reseed() {
    const btn = document.getElementById('seed-btn')
    const spinner = document.getElementById('spinner')
    btn.disabled = true
    spinner.style.display = 'inline-block'
    try {
      await fetch('/api/seed', { method: 'POST' })
      await poll()
    } finally {
      btn.disabled = false
      spinner.style.display = 'none'
    }
  }

  async function poll() {
    try {
      const res = await fetch('/api/latest')
      const data = await res.json()
      if (!data.ok || data.empty) return

      document.getElementById('error-banner').style.display = 'none'
      renderResults(data)
    } catch (err) {
      const banner = document.getElementById('error-banner')
      banner.textContent = 'Could not reach server: ' + err.message
      banner.style.display = 'block'
    }
  }

  function renderResults(data) {
    document.getElementById('empty').style.display = 'none'

    if (data.timestamp) {
      document.getElementById('timestamp').textContent = 'Last run ' + new Date(data.timestamp).toLocaleTimeString()
    }
    if (data.nextRun) {
      document.getElementById('next-run').innerHTML = 'Next run <span>' + new Date(data.nextRun).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</span>'
    }

    const grid = document.getElementById('grid')
    grid.style.display = 'grid'
    grid.innerHTML = ''

    const detectorTypes = data.detectorTypes ?? {}

    data.users.forEach((user, i) => {
      const colorIdx = i % 3
      const initials = user.label.split(/[\s._]+/).map(w => w[0]?.toUpperCase() ?? '').join('').slice(0, 2)

      user.notifications.forEach(n => {
        const typeColor = typeColors[n.type] ?? '#52525b'
        const scheduledDate = n.scheduledAt ? new Date(n.scheduledAt) : null
        const isFuture = scheduledDate && scheduledDate.getTime() > Date.now()
        const scheduledLabel = isFuture
          ? 'Scheduled ' + scheduledDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' · ' + scheduledDate.toLocaleDateString([], { month: 'short', day: 'numeric' })
          : null
        const detectorLabel = n.detector && n.detector !== 'unknown' ? n.detector : null
        const sdkType = detectorTypes[n.detector]
        const sdkTypeLabel = sdkType ? typeLabels[sdkType] ?? sdkType : null

        // fire desktop notification for new ones
        const notifKey = user.id + ':' + (n.detector ?? '') + ':' + (n.scheduledAt ?? n.message.slice(0, 20))
        if (!shownIds.has(notifKey)) {
          shownIds.add(notifKey)
          fireDesktopNotif(user.label, n.message)
        }

        const card = document.createElement('div')
        card.className = 'user-card'
        card.innerHTML = `
          <div class="user-card-header">
            <div class="avatar color-${colorIdx}">${escapeHtml(initials)}</div>
            <div class="user-info">
              <div class="user-name">${escapeHtml(user.label)}</div>
              <div style="display:flex;gap:4px;margin-top:3px;align-items:center">
                <span style="background:${typeColor};color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px">${escapeHtml(n.type ?? '')}</span>
                ${detectorLabel ? `<span style="font-size:10px;color:#71717a">${escapeHtml(detectorLabel)}</span>` : ''}
                ${sdkTypeLabel ? `<span style="font-size:10px;color:#3f3f46">[${escapeHtml(sdkTypeLabel)}]</span>` : ''}
              </div>
            </div>
          </div>
          <div class="notifications-list">
            <div class="notif-item">${escapeHtml(n.message)}${scheduledLabel ? `<span class="notif-time">${escapeHtml(scheduledLabel)}</span>` : ''}</div>
          </div>
        `
        grid.appendChild(card)
      })
    })
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  }

  poll()
  setInterval(poll, 60000)
</script>

</body>
</html>
