<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oraku Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --accent: #6c63ff;
      --accent-hover: #5a52e0;
      --text: #e2e5f0;
      --muted: #6b7280;
      --danger: #ef4444;
      --success: #22c55e;
      --warn: #f59e0b;
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .logo {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    header .logo span { color: var(--accent); }

    #auth-bar {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #auth-status {
      font-size: 12px;
      color: var(--muted);
    }

    #auth-status.ok { color: var(--success); }
    #auth-status.fail { color: var(--danger); }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px;
    }

    #login-panel {
      max-width: 400px;
      margin: 80px auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
    }

    #login-panel h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    #content { display: none; }

    h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .section {
      margin-bottom: 40px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    tr:hover td { background: rgba(255,255,255,0.02); }

    .key-cell {
      font-family: 'Menlo', 'Monaco', monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .empty-row td {
      text-align: center;
      color: var(--muted);
      padding: 32px;
    }

    input[type="text"], input[type="password"], input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      padding: 7px 10px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: var(--accent); }

    .inline-input {
      width: auto;
      max-width: 200px;
    }

    button {
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      padding: 7px 14px;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: rgba(255,255,255,0.07);
      color: var(--text);
    }

    .btn-secondary:hover { background: rgba(255,255,255,0.12); }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid transparent;
    }

    .btn-danger:hover {
      background: rgba(239,68,68,0.1);
      border-color: var(--danger);
    }

    .btn-save {
      background: transparent;
      color: var(--success);
      border: 1px solid transparent;
      padding: 5px 10px;
      font-size: 12px;
    }

    .btn-save:hover {
      background: rgba(34,197,94,0.1);
      border-color: var(--success);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 18px;
      font-size: 13px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.ok { border-left: 3px solid var(--success); }
    .toast.err { border-left: 3px solid var(--danger); }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 500;
    }

    .badge-active { background: rgba(34,197,94,0.15); color: var(--success); }
    .badge-revoked { background: rgba(239,68,68,0.1); color: var(--danger); }

    .field-group { margin-bottom: 14px; }
    .field-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }

    .actions { display: flex; gap: 6px; align-items: center; }
  </style>
</head>
<body>

<header>
  <div class="logo">oraku <span>admin</span></div>
  <div id="auth-bar">
    <span id="auth-status">not authenticated</span>
  </div>
</header>

<main>

  <!-- Login panel -->
  <div id="login-panel">
    <h2>Sign in</h2>
    <div class="field-group">
      <label>Admin secret</label>
      <input type="password" id="secret-input" placeholder="Enter ADMIN_SECRET" />
    </div>
    <button class="btn-primary" onclick="login()" style="width:100%;margin-top:4px;">Continue</button>
    <p id="login-error" style="color:var(--danger);font-size:12px;margin-top:10px;display:none;"></p>
  </div>

  <!-- Main content -->
  <div id="content">

    <!-- Project Settings -->
    <div class="section">
      <div class="section-header">
        <h2>Project Settings</h2>
        <button class="btn-secondary" onclick="loadSettings()">Refresh</button>
      </div>
      <div class="card">
        <table id="settings-table">
          <thead>
            <tr>
              <th>API Key</th>
              <th>Webhook URL</th>
              <th>Notifications / User</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="settings-body">
            <tr class="empty-row"><td colspan="4">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Access Keys -->
    <div class="section">
      <div class="section-header">
        <h2>Access Keys</h2>
        <div class="actions">
          <input type="text" id="new-key-name" placeholder="Key name" style="max-width:160px" />
          <select id="new-key-project" style="max-width:160px"><option value="">Select project…</option></select>
          <label style="font-size:0.85rem"><input type="checkbox" id="scope-ingest" value="ingest" checked /> ingest</label>
          <label style="font-size:0.85rem"><input type="checkbox" id="scope-notifications" value="notifications" checked /> notifications</label>
          <label style="font-size:0.85rem"><input type="checkbox" id="scope-detectors" value="detectors" /> detectors</label>
          <button class="btn-primary" onclick="createKey()">Generate key</button>
        </div>
      </div>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Key</th>
              <th>Scopes</th>
              <th>Created</th>
              <th>Last used</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="keys-body">
            <tr class="empty-row"><td colspan="7">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Audit Log -->
    <div class="section">
      <div class="section-header">
        <h2>Audit Log</h2>
        <button class="btn-secondary" onclick="loadAudit()">Refresh</button>
      </div>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>API Key</th>
              <th>Method</th>
              <th>Path</th>
              <th>Status</th>
              <th>IP</th>
            </tr>
          </thead>
          <tbody id="audit-body">
            <tr class="empty-row"><td colspan="6">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</main>

<div class="toast" id="toast"></div>

<script src="/admin/dashboard.js"></script>

</body>
</html>
